databaseChangeLog:
  - changeSet:
      id: dashboard-001-create-admin-users
      author: phx
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: admin_users
      changes:
        - createTable:
            tableName: admin_users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: dashboard-002-create-ad-requests
      author: phx
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: ad_requests
      changes:
        - createTable:
            tableName: ad_requests
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: company_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: contact_person
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: contact_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: contact_phone
                  type: VARCHAR(255)
              - column:
                  name: ad_title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: ad_description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: ad_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: ad_goal
                  type: VARCHAR(255)
              - column:
                  name: media_url
                  type: TEXT
              - column:
                  name: media_content
                  type: TEXT
              - column:
                  name: media_notes
                  type: TEXT
              - column:
                  name: cta
                  type: VARCHAR(255)
              - column:
                  name: views_per_day
                  type: INT
              - column:
                  name: minutes_per_day
                  type: INT
              - column:
                  name: start_date
                  type: DATE
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: approved_at
                  type: TIMESTAMP
              - column:
                  name: rejected_at
                  type: TIMESTAMP

  - changeSet:
      id: dashboard-003-create-dashboard-settings
      author: phx
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: dashboard_settings
      changes:
        - createTable:
            tableName: dashboard_settings
            columns:
              - column:
                  name: setting_key
                  type: VARCHAR(120)
                  constraints:
                    primaryKey: true
              - column:
                  name: setting_value
                  type: TEXT
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: dashboard-004-add-admin-users-deleted
      author: phx
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: admin_users
            columnName: deleted
      changes:
        - addColumn:
            tableName: admin_users
            columns:
              - column:
                  name: deleted
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql: ALTER TABLE admin_users ADD CONSTRAINT admin_users_deleted_check CHECK (deleted IN (0, 1))

  - changeSet:
      id: dashboard-005-add-ad-requests-deleted
      author: phx
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ad_requests
            columnName: deleted
      changes:
        - addColumn:
            tableName: ad_requests
            columns:
              - column:
                  name: deleted
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql: ALTER TABLE ad_requests ADD CONSTRAINT ad_requests_deleted_check CHECK (deleted IN (0, 1))

  - changeSet:
      id: dashboard-006-add-dashboard-settings-deleted
      author: phx
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: dashboard_settings
            columnName: deleted
      changes:
        - addColumn:
            tableName: dashboard_settings
            columns:
              - column:
                  name: deleted
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql: ALTER TABLE dashboard_settings ADD CONSTRAINT dashboard_settings_deleted_check CHECK (deleted IN (0, 1))
